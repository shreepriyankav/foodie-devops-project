spring.application.name=foodie-backend
server.port=8080

# PostgreSQL connection - values come from environment variables set in docker-compose.yml
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fooddb}
spring.datasource.username=${DB_USER:foodie}
spring.datasource.password=${DB_PASSWORD:foodie123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info
