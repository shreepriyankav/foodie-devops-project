<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foodie - Product Details</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">🍔 Foodie</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="#">Orders</a>
      <a href="#">Offers</a>
    </div>
    <div class="nav-right">
      <div class="location">📍 Coimbatore ▾</div>
      <div class="search-icon">🔍</div>
      <div class="cart-icon" onclick="location.href='cart.html'">🛒 <span id="cart-count" class="badge">0</span></div>
    </div>
  </header>

  <section class="product-page">
    <a class="back-link" onclick="history.back()">← Back to Menu</a>
    <div class="product-detail">
      <div class="product-img-large">
        <img id="product-img" src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800&q=80" alt="Dish">
      </div>
      <div class="product-info">
        <h1 id="product-name">Loading...</h1>
        <div class="rating" id="product-rating">⭐ 4.6 (120 ratings)</div>
        <p class="desc" id="product-desc">Loading description...</p>
        <div class="price-large" id="product-price">₹0</div>
        <div class="qty-selector">
          <button onclick="changeQty(-1)">−</button>
          <span id="qty">1</span>
          <button onclick="changeQty(1)">+</button>
        </div>
        <button class="add-cart-large" onclick="addProductToCart()">Add to Cart</button>
      </div>
    </div>
  </section>

  <div class="footer-note">Foodie Demo · Nginx + Spring Boot + PostgreSQL</div>

  <script src="js/app.js"></script>
  <script>
    let qty = 1;
    let currentDish = null;

    function changeQty(delta) {
      qty = Math.max(1, qty + delta);
      document.getElementById("qty").textContent = qty;
    }

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      try {
        const res = await fetch(`/api/dishes/${id}`);
        const dish = await res.json();
        currentDish = dish;
        document.getElementById("product-name").textContent = dish.name;
        document.getElementById("product-desc").textContent = dish.description || "";
        document.getElementById("product-price").textContent = "₹" + dish.price;
        if (dish.imageUrl) document.getElementById("product-img").src = dish.imageUrl;
      } catch (err) {
        document.getElementById("product-name").textContent = "Could not load product";
      }
    }

    function addProductToCart() {
      if (!currentDish) return;
      const cart = getCart();
      const existing = cart.find(i => i.id === currentDish.id);
      if (existing) existing.qty += qty;
      else cart.push({ ...currentDish, qty });
      saveCart(cart);
      window.location.href = "cart.html";
    }

    document.addEventListener("DOMContentLoaded", loadProduct);
  </script>
</body>
</html>
