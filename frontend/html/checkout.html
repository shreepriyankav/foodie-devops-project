<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foodie - Checkout</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">🍔 Foodie</div>
    <div class="nav-links"><a href="index.html">Home</a><a href="menu.html">Menu</a></div>
    <div class="nav-right"><div class="location">📍 Coimbatore ▾</div></div>
  </header>

  <section class="checkout-page">
    <h2 style="text-align:center;margin-bottom:8px;">Checkout — Step 1 of 3</h2>
    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div class="form-card">
      <h3>Delivery Address</h3>
      <div class="address-option selected">
        <div>
          <strong>Home</strong> <span style="color:#ff5722;font-size:12px;">DEFAULT</span>
          <p style="color:#777;margin-top:6px;">123, RS Puram, Coimbatore, Tamil Nadu - 641002</p>
        </div>
      </div>
      <div class="address-option">
        <div>
          <strong>Office</strong>
          <p style="color:#777;margin-top:6px;">456, Peelamedu, Coimbatore, Tamil Nadu - 641004</p>
        </div>
      </div>
      <textarea rows="3" placeholder="Delivery instructions (optional) e.g. Don't ring the bell, leave it at the door."></textarea>
    </div>

    <div class="cart-summary">
      <div class="row"><span>Total Payable</span><span id="total-payable">₹0</span></div>
      <button class="next-btn" onclick="location.href='payment.html'">Continue</button>
    </div>
  </section>

  <div class="footer-note">Foodie Demo · Nginx + Spring Boot + PostgreSQL</div>

  <script src="js/app.js"></script>
  <script>
    const cart = getCart();
    const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
    const total = subtotal + (cart.length ? 30 : 0);
    document.getElementById("total-payable").textContent = "₹" + total;
  </script>
</body>
</html>
